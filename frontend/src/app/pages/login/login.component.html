<div class="login-container">
  <form class="login-form" [formGroup]="loginForm" (ngSubmit)="login()">
    <h1>Login</h1>

    <label for="email">Email</label>
    <input id="email" type="email" formControlName="email" placeholder="usuario@gmail.com">

    <label for="password">Password</label>
    <input id="password" type="password" formControlName="password">

    <button type="submit" [disabled]="loginForm.invalid">Iniciar sesión</button>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }

    @if (token()) {
      <p class="success-message">Login exitoso. Token JWT:</p>
      <p class="token">{{ token() }}</p>
    }
  </form>
</div>
